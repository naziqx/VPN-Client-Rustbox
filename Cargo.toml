[workspace]
resolver = "3"
members = ["crates/platform", "crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
rustbox-platform = { path = "crates/platform" }
rustbox-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
url = "2"
percent-encoding = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "gzip"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
eframe = "0.36"
egui_extras = "0.36"
libc = "0.2"
arboard = { version = "3", features = ["wayland-data-control"] }
