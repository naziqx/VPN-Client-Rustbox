[package]
name = "rustbox-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OS abstraction layer for RustBox (paths, system proxy, TUN privileges, core lookup)"

[dependencies]
anyhow.workspace = true
dirs.workspace = true
tracing.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Networking_WinInet", "Win32_Security", "Win32_System_Threading"] }
